name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "linux-gcc",   os: ubuntu-latest,  cc: gcc,   extra: "" }
          - { name: "linux-clang", os: ubuntu-latest,  cc: clang, extra: "" }
          # ⚠ gcc here, deliberately, and not clang.  The binding tests dlopen
          # an instrumented libhackmotion_ffi.so from a stock CPython, and
          # clang's ASan cannot place its shadow in an already-mapped non-PIE
          # interpreter — "Shadow memory range interleaves with an existing
          # memory mapping".  That is a limit of the environment, not anything
          # this library does.  gcc's runtime is shared and initialises cleanly,
          # so the sanitizers cover ALL 24 tests rather than the C ones only.
          # clang still builds and runs this tree in the job above.
          - { name: "linux-san",   os: ubuntu-latest,  cc: gcc,
              extra: "-DHM_ENABLE_ASAN=ON -DHM_ENABLE_UBSAN=ON" }
          - { name: "macos",       os: macos-latest,   cc: clang, extra: "" }
          - { name: "windows",     os: windows-latest, cc: "",    extra: "" }
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug ${{ matrix.extra }}
        env:
          CC: ${{ matrix.cc }}
      - name: Build
        run: cmake --build build --config Debug --parallel
      - name: Test
        run: ctest --test-dir build --build-config Debug --output-on-failure

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcovr
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DHM_ENABLE_COVERAGE=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      # The core algorithms are the reason this library exists; they are held to
      # a high bar because a gap there is a silently wrong swing, not a crash.
      - run: >
          gcovr -r . --filter 'src/' --exclude-unreachable-branches
          --fail-under-line 85 --print-summary
