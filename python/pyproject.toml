[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hackmotion"
version = "0.1.0"
description = "Python bindings for libhackmotion, the sans-I/O HackMotion wG3 library"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "libhackmotion contributors" }]
keywords = ["hackmotion", "ble", "imu", "golf", "sensor"]

# ⚠ NO REQUIRED DEPENDENCIES, AND THAT IS DELIBERATE.  The binding is ctypes over
# a shared object; anything else it needed would be something a consumer has to
# reconcile with their own stack.
dependencies = []

[project.optional-dependencies]
# The radio.  Only tools/hm_bench.py and hackmotion.bleak_transport need it, and
# the core binding imports and works without it.
bleak = ["bleak>=0.21"]
# A zero-copy structured view over a sample array.  Samples.numpy() is the only
# thing that touches it.
numpy = ["numpy>=1.21"]

[tool.setuptools.packages.find]
include = ["hackmotion*"]

# ⚠ THE SHARED OBJECT IS NOT PACKAGED YET, and the binding says so loudly rather
# than half-working: it looks for `libhackmotion_ffi` via HACKMOTION_LIBRARY,
# then the repo's build directories, then beside the package, then the platform
# loader — and raises LibraryNotFound with the cmake lines if none of those has
# it.  Bundling a built object per platform is its own piece of work and belongs
# after the binding has met a sensor, not before.
